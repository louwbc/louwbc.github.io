<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <title>我的收藏 · 电视 + 电台</title>
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/site.css?v=20260528c">
  <link rel="stylesheet" href="./my-favorites.css?v=20260922a">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg viewBox="0 0 24 24" class="logo" aria-hidden="true"><path d="M5 5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5zm2 0v14h10V5H7zm2 2h6v2H9V7zm0 3h6v2H9v-2zm0 3h4v2H9v-2z" fill="currentColor"/></svg>
        <div class="brand-title">我的收藏</div>
        <span class="version-chip" aria-label="当前版本">v1.0</span>
      </div>
      <nav class="nav">
        <a href="../../">首页</a>
        <a href="../../blog/">博客</a>
        <a href="../global-fm/">全球FM</a>
        <a href="../global-tv/">全球电视</a>
        <a href="../podcast/">全球播客</a>
        <a href="../pomodoro/">番茄钟</a>
        <a href="../pdf-tool/">PDF工具</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card card-pad hero-panel">
      <div class="hero-copy">
        <div class="eyebrow">Unified Favorites</div>
        <h1 class="hero-title">跨应用统一收藏</h1>
        <p class="hero-text">在这里同时管理你收藏的全球电视频道和全球电台。可随时一键跳转至对应应用播放，并独立调整统一列表的顺序。统一收藏与各应用内部的独立收藏互不干扰。</p>
      </div>
      <div class="hero-meta">
        <div class="meta-pill">电视 + 电台混排</div>
        <div class="meta-pill">上限 600 条</div>
        <div class="meta-pill">支持搜索与类型筛选</div>
        <div class="meta-pill">自定义排序</div>
        <div class="meta-pill">导入 / 导出</div>
      </div>
      <div class="muted" id="info" style="margin-top:14px">正在载入…</div>
    </section>

    <section class="card card-pad controls-panel" style="margin-top:12px">
      <div class="row filters-row">
        <input id="searchInput" class="input" type="search" placeholder="搜索标题、国家、语言或分类…" autocomplete="off" aria-label="搜索">
        <select id="typeSelect" class="input" aria-label="类型">
          <option value="">全部类型</option>
          <option value="tv">仅电视</option>
          <option value="fm">仅电台</option>
        </select>
      </div>
      <div class="row lower-row">
        <div class="tabs" role="tablist" aria-label="类型过滤">
          <button class="btn tab active" id="tabAll" data-type="all" role="tab" aria-selected="true">全部</button>
          <button class="btn tab" id="tabTv" data-type="tv" role="tab" aria-selected="false">电视</button>
          <button class="btn tab" id="tabFm" data-type="fm" role="tab" aria-selected="false">电台</button>
        </div>
        <div class="row utility-row">
          <button class="btn" id="exportBtn" type="button">导出</button>
          <button class="btn" id="importBtn" type="button">导入</button>
          <input id="importInput" type="file" accept="application/json,.json" hidden>
          <button class="btn danger" id="clearBtn" type="button">清空</button>
        </div>
      </div>
    </section>

    <section class="card card-pad list-card" style="margin-top:12px">
      <div class="list-head">
        <div>
          <h2 class="section-title">收藏列表</h2>
          <div class="muted" id="listMeta">共 0 条（电视 0 · 电台 0）</div>
        </div>
      </div>
      <div class="fav-list" id="favList"></div>
      <div class="muted empty-tip" id="empty" hidden>
        还没有统一收藏。去「全球电视」或「全球FM」里，在任意频道/电台卡片上点「合并收藏」把它们加入到这里。
      </div>
    </section>
  </main>

  <script src="./my-favorites.js?v=20260922a" type="module"></script>
</body>
</html>
