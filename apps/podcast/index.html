<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <title>全球播客</title>
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/site.css?v=20260528c">
  <link rel="stylesheet" href="./podcast.css?v=20260619a">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg viewBox="0 0 24 24" class="logo" aria-hidden="true"><path d="M4 7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v7a4 4 0 0 1-4 4h-2.2l1.1 2.2a1 1 0 1 1-1.8.9L11.4 18H7a3 3 0 0 1-3-3V7zm3-1a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h10a2 2 0 0 0 2-2V7a1 1 0 0 0-1-1H7zM6 9h2v2H6V9zm3 0h2v2H9V9z" fill="currentColor"/></svg>
        <div class="brand-title">全球播客</div>
        <span class="version-chip" aria-label="当前版本">v1.7</span>
      </div>
      <nav class="nav">
        <a href="../../">首页</a>
        <a href="../../blog/">博客</a>
        <a href="../pomodoro/">番茄钟</a>
        <a href="../xiangqi/">象棋</a>
        <a href="../global-fm/">全球FM</a>
        <a href="../pdf-tool/">PDF工具</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card card-pad">
      <div class="row" style="align-items:center;justify-content:space-between">
        <div>
          <h1 class="hero-title" style="margin:0">全球播客</h1>
          <p class="muted" style="margin:8px 0 0">浏览全球播客、搜索可播放剧集，也可以先搜出来再跳到外部页面继续收听。</p>
        </div>
      </div>
      <div class="muted" id="info" style="margin-top:12px">准备就绪</div>
    </section>

    <section class="list" id="list" style="margin-top:12px"></section>
    <div class="muted" id="empty" style="margin-top:12px" hidden>没有结果</div>
  </main>

  <footer class="player" id="player">
    <div class="now">
      <div class="now-title" id="nowTitle">未播放</div>
      <div class="now-sub muted" id="nowSub"></div>
    </div>
    <div class="controls">
      <button class="btn icon-btn" id="prevBtn" aria-label="上一集">⏮</button>
      <button class="btn primary icon-btn" id="playBtn" aria-label="播放/暂停">▶</button>
      <button class="btn icon-btn" id="nextBtn" aria-label="下一集">⏭</button>
      <input class="vol" id="vol" type="range" min="0" max="1" step="0.01" aria-label="音量">
    </div>
    <audio id="audio" preload="none"></audio>
  </footer>

  <script src="./podcast.js?v=20260705a" type="module"></script>
</body>
</html>
