<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <title>中国象棋</title>
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <link rel="stylesheet" href="./xiangqi.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg viewBox="0 0 24 24" class="logo" aria-hidden="true"><path d="M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zm-3.5 6.5h7a1 1 0 0 1 0 2h-7a1 1 0 0 1 0-2zm0 4h7a1 1 0 0 1 0 2h-7a1 1 0 1 1 0-2z" fill="currentColor"/></svg>
        <div class="brand-title">中国象棋</div>
      </div>
      <nav class="nav">
        <a href="../../">首页</a>
        <a href="../../blog/">博客</a>
        <a href="../pomodoro/">番茄钟</a>
        <a href="../global-fm/">全球FM</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card card-pad">
      <div class="row" style="align-items:center;justify-content:space-between">
        <h1 class="hero-title" style="margin:0">对弈</h1>
        <span class="badge" id="statusBadge">准备中</span>
      </div>
      <div class="muted" id="statusText" style="margin-top:8px;line-height:1.6"></div>

      <div class="board-wrap" style="margin-top:12px">
        <div class="board" id="board" role="grid" aria-label="中国象棋棋盘"></div>
        <div class="river">
          <div class="river-text">楚河</div>
          <div class="river-text">汉界</div>
        </div>
      </div>

      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="newBtn" type="button">新开一局</button>
        <button class="btn" id="undoBtn" type="button" disabled>悔棋</button>
        <label class="field compact">
          <span class="muted">你执</span>
          <select id="playerSide">
            <option value="r">红</option>
            <option value="b">黑</option>
          </select>
        </label>
        <label class="field compact">
          <span class="muted">难度</span>
          <select id="level">
            <option value="1">简单</option>
            <option value="2" selected>普通</option>
            <option value="3">较难</option>
          </select>
        </label>
      </div>
      <div class="muted" id="hint" style="margin-top:10px"></div>
    </section>

    <section class="card card-pad" style="margin-top:12px">
      <div class="row" style="align-items:center;justify-content:space-between">
        <h2 style="margin:0">走子记录</h2>
        <button class="btn" id="copyBtn" type="button">复制</button>
      </div>
      <pre class="moves" id="moves" aria-label="走子记录"></pre>
    </section>
  </main>

  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) {
          var r = regs[i]
          try {
            if (r && r.scope === (location.origin + '/')) r.unregister()
          } catch (_) {}
        }
      }).catch(function () {})
    })()
  </script>
  <script src="./xiangqi.js" type="module"></script>
</body>
</html>
