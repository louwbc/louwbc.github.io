<!doctype html>
<html lang="zh-CN">
  <head>

    <title>Solo Radio</title>
    <script>
      // 方案 1（用户指定）：自动跳 HTTP，保证 Chrome/安卓能播 HTTP 电台（浏览器 Mixed Content Block 对 HTTP 页不生效）
      // 仅命中生产域名时跳；localhost / IP / 非生产域不动，方便调试
      ;(function () {
        try {
          var h = (location.hostname || '').toLowerCase()
          if (location.protocol === 'https:' && (
            h === 'zztomatozz.com' ||
            h === 'www.zztomatozz.com' ||
            h === 'louwbc.github.io'
          )) {
            var httpUrl = 'http://' + location.host + location.pathname + location.search + location.hash
            // 替换不产生历史记录，避免用户回退到 https 又跳一次
            location.replace(httpUrl)
          }
        } catch (e) { /* noop */ }
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-DYybX41d.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/vue-CWW1NG4g.js">
    <link rel="stylesheet" crossorigin href="./assets/index-D7Q9v15w.css">
  </head>
  <body>
    <div id="app"></div>
    <!-- 全局持久播放器的 DOM：跨路由不卸载；由 src/composables/useAudioEngine / useVideoEngine 操作 -->
    <audio
      id="global-audio"
      preload="none"
      crossorigin="anonymous"
      hidden
    ></audio>
    <video
      id="global-video"
      preload="none"
      playsinline
      controls
      controlslist="nofullscreen"
      hidden
    ></video>
  </body>
