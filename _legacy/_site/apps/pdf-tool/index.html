<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <title>PDF 工具</title>
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <link rel="stylesheet" href="./pdf-tool.css?v=20260528a">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg viewBox="0 0 24 24" class="logo" aria-hidden="true"><path d="M4 7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v7a4 4 0 0 1-4 4h-2.2l1.1 2.2a1 1 0 1 1-1.8.9L11.4 18H7a3 3 0 0 1-3-3V7zm3-1a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h10a2 2 0 0 0 2-2V7a1 1 0 0 0-1-1H7zM6 9h2v2H6V9zm3 0h2v2H9V9z" fill="currentColor"/></svg>
        <div class="brand-title">PDF 工具</div>
        <span class="version-chip" aria-label="当前版本">v1.6</span>
      </div>
      <nav class="nav">
        <a href="../../">首页</a>
        <a href="../../blog/">博客</a>
        <a href="../podcast/">全球播客</a>
        <a href="../pomodoro/">番茄钟</a>
        <a href="../xiangqi/">象棋</a>
        <a href="../global-fm/">全球FM</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <section class="card card-pad">
      <div class="row" style="align-items:center;justify-content:space-between">
        <h1 class="hero-title" style="margin:0">PDF 小工具</h1>
        <div class="muted" id="info">选择一个 PDF 开始</div>
      </div>
      <div class="row" style="margin-top:12px;align-items:center">
        <input class="input" id="pdfFile" type="file" accept="application/pdf">
        <button class="btn" id="sampleBtn">生成示例 PDF</button>
      </div>
    </section>

    <section class="grid" style="margin-top:12px">
      <div class="col">
        <section class="card card-pad">
          <div class="row" style="align-items:center;justify-content:space-between">
            <h2 style="margin:0">页面</h2>
            <div class="row" style="gap:8px">
              <button class="btn" id="selectAllBtn">全选</button>
              <button class="btn" id="clearSelBtn">清空</button>
            </div>
          </div>
          <div class="muted" style="margin-top:8px">选中页面后，可删除/旋转/加水印，或导出为 JPG。</div>
          <div class="page-list" id="pageList" style="margin-top:10px"></div>
        </section>

        <section class="card card-pad" style="margin-top:12px">
          <h2 style="margin:0">编辑</h2>
          <div class="row" style="margin-top:12px;align-items:center">
            <button class="btn" id="deleteBtn">删除选中页</button>
            <button class="btn" id="rotateBtn">选中页旋转 90°</button>
          </div>

          <div class="row" style="margin-top:12px;align-items:center">
            <input class="input" id="wmText" type="text" placeholder="水印文字…" autocomplete="off">
            <input class="input" id="wmSize" type="number" min="8" max="80" value="18" inputmode="numeric" style="flex:0 1 120px">
            <input class="input" id="wmOpacity" type="number" min="0.05" max="1" step="0.05" value="0.25" inputmode="decimal" style="flex:0 1 120px">
            <button class="btn primary" id="wmBtn">应用水印</button>
          </div>

          <div class="row" style="margin-top:12px;align-items:center;justify-content:space-between">
            <button class="btn primary" id="exportPdfBtn">导出 PDF</button>
            <div class="muted">如未选页：水印默认应用到全部页面</div>
          </div>
        </section>

        <section class="card card-pad" style="margin-top:12px">
          <h2 style="margin:0">PDF → JPG</h2>
          <div class="row" style="margin-top:12px;align-items:center">
            <select class="input" id="jpgScale" aria-label="清晰度" style="flex:0 1 180px">
              <option value="1.5">清晰度：标准</option>
              <option value="1">清晰度：省内存</option>
              <option value="2">清晰度：更清晰</option>
              <option value="3">清晰度：超清</option>
            </select>
            <select class="input" id="jpgQuality" aria-label="质量" style="flex:0 1 180px">
              <option value="0.8">质量：0.8</option>
              <option value="0.7">质量：0.7</option>
              <option value="0.9">质量：0.9</option>
              <option value="1">质量：1.0</option>
            </select>
          </div>
          <div class="row" style="margin-top:12px;align-items:center">
            <button class="btn" id="exportJpgSelectedBtn">导出选中页 JPG（ZIP）</button>
            <button class="btn" id="exportJpgAllBtn">导出全部页 JPG（ZIP）</button>
          </div>
        </section>
      </div>

      <div class="col">
        <section class="card card-pad">
          <div class="row" style="align-items:center;justify-content:space-between">
            <h2 style="margin:0">预览</h2>
            <div class="row" style="gap:8px">
              <button class="btn" id="prevPageBtn">上一页</button>
              <button class="btn" id="nextPageBtn">下一页</button>
            </div>
          </div>
          <div class="muted" id="pageMeta" style="margin-top:8px"></div>
          <div class="preview" style="margin-top:10px">
            <canvas id="previewCanvas"></canvas>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) {
          var r = regs[i]
          try {
            if (r && r.scope === (location.origin + '/')) r.unregister()
          } catch (_) {}
        }
      }).catch(function () {})
    })()
  </script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js" crossorigin="anonymous"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" crossorigin="anonymous"></script>
  <script src="./pdf-tool.js?v=20260528a" defer></script>
</body>
</html>
